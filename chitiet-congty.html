        };

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            let stars = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) stars += "★";
                else stars += "☆";
            }
            return stars;
        }

        function applyJob(companyName, jobTitle) {
            alert(`Ứng tuyển thành công!\nCông ty: ${companyName}\nVị trí: ${jobTitle}`);
        }

        function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const data = companyData[id];

            if (!data) {
                document.getElementById('detailContent').innerHTML = `<div style="text-align:center;padding:60px"><h2>Không tìm thấy công ty</h2><a href="congty.html">Quay lại</a></div>`;
                return;
            }

            const jobsHtml = data.jobs.map(job => `
                <div class="job-item">
                    <div><div class="job-title">${job.title}</div><div class="job-salary">💰 ${job.salary}/tháng</div></div>
                    <button class="btn-apply" onclick="applyJob('${data.name}', '${job.title}')">Ứng tuyển</button>
                </div>
            `).join("");

            const html = `
                <div class="detail-header">
                    <div class="detail-logo"><img src="${data.logo}" alt="${data.name}" onerror="this.src='https://placehold.co/80?text=Logo'"></div>
                    <div class="detail-title">
                        <h1>${data.name}</h1>
                        <div class="detail-meta">
                            <span>📍 ${data.location}</span>
                            <span>👥 ${data.size}</span>
                            <span>📁 ${data.industry}</span>
                        </div>
                        <div class="stars" style="font-size:1rem">${renderStars(data.rating)} ${data.rating}/5</div>
                        <div class="detail-actions">
                            <button class="btn-outline" onclick="document.getElementById('review').scrollIntoView({behavior:'smooth'})">Đánh giá công ty</button>
                            <button class="btn-primary" onclick="applyJob('${data.name}', 'Vị trí phù hợp')">Ứng tuyển ngay</button>
                        </div>
                    </div>
                </div>

                <div class="detail-grid">
                    <div>
                        <div class="info-box">
                            <h3>Giới thiệu công ty</h3>
                            <p>${data.desc}</p>
                        </div>
                        <div class="info-box">
                            <h3>Phúc lợi nổi bật</h3>
                            <div class="benefit-list">${data.benefits.map(b => `<span class="benefit-item">✓ ${b}</span>`).join("")}</div>
                        </div>
                        <div class="info-box" id="review">
                            <h3>Đánh giá từ nhân viên</h3>
                            <div class="review-card">
                                <div class="stars">${renderStars(4.5)}</div>
                                <strong>Nguyễn Văn A</strong> - Nhân viên chính thức
                                <p style="margin-top:8px;color:#475569">"Môi trường làm việc chuyên nghiệp, đồng nghiệp thân thiện, cơ hội thăng tiến rõ ràng."</p>
                            </div>
                            <div class="review-form">
                                <h4>Gửi đánh giá của bạn</h4>
                                <textarea rows="3" placeholder="Chia sẻ trải nghiệm làm việc của bạn..."></textarea>
                                <button onclick="alert('Cảm ơn bạn đã đánh giá!')">Gửi đánh giá</button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="info-box">
                            <h3>Thông tin liên hệ</h3>
                            <ul class="contact-list">
                                <li>🌐 ${data.contact.web}</li>
                                <li>📞 ${data.contact.phone}</li>
                                <li>✉️ ${data.contact.email}</li>
                            </ul>
                        </div>
                        <div class="info-box">
                            <h3>Việc làm đang tuyển</h3>
                            ${jobsHtml}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detailContent').innerHTML = html;
        }

        loadDetail();

        // ========== LOGIN/LOGOUT ==========
        (function() {
            const AUTH_KEY = 'isLoggedIn';
            const USER_NAME = 'Nguyễn Văn A';
            const authDiv = document.getElementById('authButtons');
            const userDiv = document.getElementById('userBox');
            const loginBtn = document.getElementById('fakeLoginBtn');
            const registerBtn = document.getElementById('fakeRegisterBtn');
            
            function renderUI() {
                if (localStorage.getItem(AUTH_KEY) === 'true') {
                    authDiv.style.display = 'none';
                    userDiv.innerHTML = `
                        <div class="user-info">
                            <div class="user-avatar">A</div>
                            <span>${USER_NAME}</span>
                            <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
                        </div>
                    `;
                    const logoutBtn = document.getElementById('logoutBtn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', () => {
                            localStorage.setItem(AUTH_KEY, 'false');
                            renderUI();
                            alert('Đã đăng xuất!');
                        });
                    }
                } else {
                    authDiv.style.display = 'flex';
                    userDiv.innerHTML = '';
                }
            }
            
            if (loginBtn) {
                loginBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.setItem(AUTH_KEY, 'true');
                    renderUI();
                    alert('Đăng nhập thành công!');
                });
            }
            if (registerBtn) {
                registerBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.setItem(AUTH_KEY, 'true');
                    renderUI();
                    alert('Đăng ký thành công!');
                });
            }
            renderUI();
        })();
    </script>
</body>
