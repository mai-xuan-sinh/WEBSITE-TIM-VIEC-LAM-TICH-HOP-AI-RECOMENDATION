<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danang Work - Tất cả việc làm</title>

    <link rel="stylesheet" href="trangvieclam.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="floating.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        .comp-logo {
            width: 55px;
            height: 55px;
            background: #f0f2f5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .comp-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .nav-links a.active-link {
            color: #0ea5e9 !important;
            position: relative;
        }
        .nav-links a.active-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            border-radius: 999px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 6px 15px;
            border-radius: 40px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .logout-btn {
            background: #ef4444;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        #userBox { display: none; }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="container nav-content">
            <div class="logo-area">
                <div class="logo-main">DANANG WORK</div>
                <div class="logo-slogan">Tìm việc thông minh tại Đà Nẵng</div>
            </div>
            <nav class="nav-links">
                <a href="index.html">Trang chủ</a>
                <a href="trangvieclam.html" class="active-link">Việc làm</a>
                <a href="congty.html">Công ty</a>
                <a href="xuhuong.html">Xu hướng</a>
                <a href="huongdan.html">Hướng dẫn</a>
                <a href="taocv.html">Tạo CV</a>
                <a href="hotro.html">Hỗ trợ</a>
            </nav>
            <div class="nav-right">
                <div id="authButtons">
                    <a href="login.html">Đăng nhập</a>
                    <a href="register.html">Đăng ký</a>
                </div>
                <div id="userBox"></div>
            </div>
        </div>
    </header>

    <main class="container content-wrapper">
        <div class="breadcrumb">
            Trang chủ / <strong>Tất cả việc làm</strong>
        </div>

        <div class="header-section">
            <div class="title-group">
                <h1>Tất cả việc làm</h1>
                <p class="results-count">Đang tải...</p>
            </div>
        </div>

        <div class="search-bar">
            <div class="search-item autocomplete-wrapper">
                <i class="fas fa-briefcase"></i>
                <input type="text" id="skillInput" placeholder="Vị trí, kỹ năng, công ty..." autocomplete="off">
                <div id="suggestionsList" class="suggestions-dropdown"></div>
            </div>
            <div class="search-item" id="districtSelectWrapper">
                <i class="fas fa-map-marker-alt"></i>
                <select id="districtSelect">
                    <option value="">-- Chọn địa điểm --</option>
                    <option value="Liên Chiểu">Quận Liên Chiểu</option>
                    <option value="Thanh Khê">Quận Thanh Khê</option>
                    <option value="Hải Châu">Quận Hải Châu</option>
                    <option value="Ngũ Hành Sơn">Quận Ngũ Hành Sơn</option>
                    <option value="Sơn Trà">Quận Sơn Trà</option>
                    <option value="Cẩm Lệ">Quận Cẩm Lệ</option>
                </select>
            </div>
            <button class="search-btn" id="searchBtn">
                Tìm kiếm <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="search-suggestions">
            Gợi ý: <text>React</text>, <text>Node.js</text>, <text>Frontend</text>, <text>Backend</text>
        </div>

        <div id="fieldCards" class="field-cards"></div>
        <div class="job-list" id="all-jobs-container"></div>
    </main>

    <!-- APPLY MODAL -->
    <div class="apply-modal" id="applyModal">
        <div class="apply-box">
            <button class="close-apply" id="closeApply"><i class="fas fa-times"></i></button>
            <h2>Ứng tuyển công việc</h2>
            <div class="apply-job-info">
                <h3 id="applyJobTitle">Tên công việc</h3>
                <p id="applyCompany">Công ty</p>
                <div class="apply-meta">
                    <span id="applyLocation"><i class="fas fa-map-marker-alt"></i></span>
                    <span id="applySalary"><i class="fas fa-money-bill-wave"></i></span>
                </div>
            </div>
            <form id="applyForm">
                <div class="form-group"><label>Họ và tên</label><input type="text" id="applyName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="applyEmail" required></div>
                <div class="form-group"><label>Số điện thoại</label><input type="text" id="applyPhone" required></div>
                <div class="form-group">
                    <label>Chọn CV đã lưu</label>
                    <select id="savedCVSelect"><option value="">-- Chọn CV --</option></select>
                </div>
                <div class="selected-cv-info" id="selectedCVInfo"></div>
                <div class="form-group form-full">
                    <label>Giới thiệu bản thân</label>
                    <textarea id="applyMessage" rows="4" placeholder="Nhập giới thiệu ngắn..."></textarea>
                </div>
                <div class="form-group form-full">
                    <label>Tải lên CCCD/CMND</label>
                    <input type="file" id="applyCCCD">
                </div>
                <div class="form-group form-full">
                    <label>Tải lên Hộ chiếu</label>
                    <input type="file" id="applyPassport">
                </div>
                <button type="submit" class="submit-apply-btn"><i class="fas fa-paper-plane"></i> Gửi ứng tuyển</button>
            </form>
        </div>
    </div>

    <script src="jobs-data.js"></script>
    <script>
        // ==================== LẤY TẤT CẢ JOBS TỪ NHIỀU NGUỒN ====================
        function getAllJobs() {
            let allJobsList = [];
            
            // 1. Lấy từ jobs-data.js (static data)
            if (typeof allJobs !== 'undefined' && allJobs.length > 0) {
                allJobsList = [...allJobs];
            }
            
            // 2. Lấy từ localStorage jobs (nơi Admin duyệt)
            const storedJobs = JSON.parse(localStorage.getItem('jobs')) || [];
            
            // 3. Lấy từ hr_jobs (nơi HR đăng tin)
            const hrJobs = JSON.parse(localStorage.getItem('hr_jobs')) || [];
            
            // Gộp tất cả
            let combined = [...allJobsList, ...storedJobs, ...hrJobs];
            
            // Lọc chỉ lấy jobs có status = "active" hoặc "approved" hoặc không có status (job cũ)
            const activeJobs = combined.filter(job => {
                // Nếu job có status và không phải active thì bỏ qua
                if (job.status && job.status !== 'active' && job.status !== 'approved') {
                    return false;
                }
                // Đảm bảo có title
                return job.title && job.title.trim() !== '';
            });
            
            // Loại bỏ trùng lặp theo id
            const uniqueJobs = [];
            const ids = new Set();
            for (const job of activeJobs) {
                if (!ids.has(job.id)) {
                    ids.add(job.id);
                    uniqueJobs.push(job);
                }
            }
            
            console.log(`📊 Đã tải ${uniqueJobs.length} việc làm (allJobs: ${allJobsList.length}, stored: ${storedJobs.length}, hr: ${hrJobs.length})`);
            
            return uniqueJobs;
        }
        
        // Biến lưu jobs hiện tại
        let currentJobs = [];
        
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("all-jobs-container");
            const skillInput = document.getElementById("skillInput");
            const districtSelect = document.getElementById("districtSelect");
            const searchBtn = document.getElementById("searchBtn");
            const suggestionsList = document.getElementById("suggestionsList");

            // ==================== RENDER JOBS ====================
            function renderJobs(jobs) {
                currentJobs = jobs;
                if (!container) return;
                
                if (jobs.length === 0) {
                    container.innerHTML = `<div class="no-job"><i class="fas fa-briefcase"></i><p>Không có công việc phù hợp</p></div>`;
                    document.querySelector(".results-count").textContent = `Hiển thị 0 việc làm`;
                    return;
                }
                
                container.innerHTML = jobs.map(job => `
                    <div class="job-item" onclick="goToJobDetail(${job.id})">
                        <div class="job-card">
                            <div class="card-top">
                                <div class="comp-logo">
                                    <img src="${job.image || 'img/fpt.jpg'}" alt="${job.company}" onerror="this.src='img/fpt.jpg'; this.onerror=null;">
                                </div>
                                <div class="job-meta">
                                    <h3>${escapeHtml(job.title)}</h3>
                                    <p>${escapeHtml(job.company)}</p>
                                </div>
                            </div>
                            <div class="card-mid">
                                <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(job.location || job.district || 'Đà Nẵng')}</span>
                                <span><i class="fas fa-money-bill-wave"></i> ${escapeHtml(job.salary || 'Thỏa thuận')}</span>
                            </div>
                            <div class="card-tags">${(job.skills || []).map(skill => `<span>${escapeHtml(skill)}</span>`).join("")}</div>
                            <div class="card-bottom">
                                <button class="btn-detail" onclick="viewDetail(event, ${job.id})"><i class="fas fa-eye"></i> Xem chi tiết</button>
                                <button class="btn-apply" onclick="applyJob(event, ${job.id})">Ứng tuyển</button>
                            </div>
                        </div>
                    </div>
                `).join("");
                document.querySelector(".results-count").textContent = `Hiển thị ${jobs.length} việc làm`;
            }
            
            // Escape HTML để tránh lỗi
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            // ==================== FIELD CARDS ====================
            function renderFieldCards() {
                const fieldContainer = document.getElementById("fieldCards");
                if (!fieldContainer) return;
                
                const jobs = getAllJobs();
                const counts = {};
                jobs.forEach(job => { 
                    if (job.field) counts[job.field] = (counts[job.field] || 0) + 1; 
                });
                
                if (Object.keys(counts).length === 0) {
                    fieldContainer.innerHTML = `<div class="no-job" style="grid-column:1/-1">Đang tải danh mục...</div>`;
                    return;
                }
                
                fieldContainer.innerHTML = Object.entries(counts).map(([field, total]) => `
                    <div class="field-card" data-field="${escapeHtml(field)}">
                        <h3>${escapeHtml(field)}</h3>
                        <p>${total} việc làm</p>
                    </div>
                `).join("");
                
                document.querySelectorAll(".field-card").forEach(card => {
                    card.addEventListener("click", () => {
                        const jobs = getAllJobs();
                        renderJobs(jobs.filter(job => job.field === card.dataset.field));
                    });
                });
            }

            // ==================== SEARCH ====================
            function searchJobs() {
                const keyword = skillInput.value.toLowerCase().trim();
                const district = districtSelect.value.toLowerCase().trim();
                const allJobsList = getAllJobs();
                
                const filtered = allJobsList.filter(job => {
                    const matchKeyword = keyword === "" || 
                        job.title?.toLowerCase().includes(keyword) || 
                        job.company?.toLowerCase().includes(keyword) || 
                        (job.skills || []).join(" ").toLowerCase().includes(keyword);
                    const matchDistrict = district === "" || 
                        (job.location || job.district || "").toLowerCase().includes(district);
                    return matchKeyword && matchDistrict;
                });
                renderJobs(filtered);
            }

            // ==================== AUTOCOMPLETE ====================
            skillInput.addEventListener("input", () => {
                const value = skillInput.value.toLowerCase().trim();
                if (!value) { suggestionsList.innerHTML = ""; return; }
                
                const allJobsList = getAllJobs();
                const suggestions = [];
                allJobsList.forEach(job => {
                    if (job.title?.toLowerCase().includes(value)) suggestions.push(job.title);
                    if (job.company?.toLowerCase().includes(value)) suggestions.push(job.company);
                    (job.skills || []).forEach(skill => { 
                        if (skill.toLowerCase().includes(value)) suggestions.push(skill); 
                    });
                });
                const uniqueSuggestions = [...new Set(suggestions)].slice(0, 6);
                suggestionsList.innerHTML = uniqueSuggestions.map(item => `<div class="suggestion-item">${escapeHtml(item)}</div>`).join("");
                
                document.querySelectorAll(".suggestion-item").forEach(item => {
                    item.addEventListener("click", () => {
                        skillInput.value = item.textContent.trim();
                        suggestionsList.innerHTML = "";
                        searchJobs();
                    });
                });
            });

            searchBtn.addEventListener("click", searchJobs);
            skillInput.addEventListener("keyup", (e) => { if (e.key === "Enter") searchJobs(); });
            districtSelect.addEventListener("change", searchJobs);

            window.goToJobDetail = function(id) { 
                window.location.href = `job-detail.html?id=${id}`; 
            };
            
            window.viewDetail = function(event, id) { 
                event.stopPropagation(); 
                window.location.href = `job-detail.html?id=${id}`; 
            };

            // ==================== HÀM ỨNG TUYỂN CHÍNH ====================
            function submitApplication(jobId, jobTitle, company, location, salary, cvData, cccdFileName, passportFileName) {
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                if (!currentUser) {
                    alert('Vui lòng đăng nhập để ứng tuyển!');
                    window.location.href = 'login.html';
                    return false;
                }
                
                const applicationId = Date.now();
                const today = new Date();
                const dateDisplay = today.toLocaleDateString('vi-VN');
                
                const application = {
                    id: applicationId,
                    jobId: jobId,
                    jobTitle: jobTitle,
                    company: company,
                    location: location,
                    salary: salary,
                    userEmail: currentUser.email,
                    candidateEmail: currentUser.email,
                    userName: cvData.fullName || currentUser.name || currentUser.fullname || 'Ứng viên',
                    candidateName: cvData.fullName || currentUser.name || currentUser.fullname || 'Ứng viên',
                    userPhone: cvData.phone || currentUser.phone || '',
                    phone: cvData.phone || currentUser.phone || '',
                    skills: cvData.skills || '',
                    experience: cvData.experience || '',
                    education: cvData.education || '',
                    intro: cvData.intro || '',
                    cccdFileName: cccdFileName,
                    passportFileName: passportFileName,
                    date: dateDisplay,
                    fullDate: today.toISOString(),
                    status: 'pending'
                };
                
                let applications = JSON.parse(localStorage.getItem('applications')) || [];
                applications.push(application);
                localStorage.setItem('applications', JSON.stringify(applications));
                
                let hrCandidates = JSON.parse(localStorage.getItem('hr_candidates')) || [];
                const existingIndex = hrCandidates.findIndex(c => 
                    c.jobId === jobId && (c.email === currentUser.email || c.candidateEmail === currentUser.email)
                );
                
                if (existingIndex === -1) {
                    const newCandidate = {
                        id: applicationId,
                        name: application.userName,
                        email: currentUser.email,
                        candidateEmail: currentUser.email,
                        phone: application.userPhone,
                        position: jobTitle,
                        company: company,
                        jobId: jobId,
                        skills: cvData.skills ? (typeof cvData.skills === 'string' ? cvData.skills.split(/[,\n]+/).map(s => s.trim()) : cvData.skills) : [],
                        experience: cvData.experience || '',
                        education: cvData.education || '',
                        address: cvData.address || '',
                        intro: cvData.intro || '',
                        date: dateDisplay,
                        fullDate: today.toISOString(),
                        status: 'pending',
                        cvData: cvData
                    };
                    hrCandidates.push(newCandidate);
                    localStorage.setItem('hr_candidates', JSON.stringify(hrCandidates));
                }
                
                let notifications = JSON.parse(localStorage.getItem('hr_notifications')) || [];
                notifications.unshift({
                    id: Date.now(),
                    title: '📝 Ứng viên mới',
                    content: `${application.userName} đã ứng tuyển vị trí "${jobTitle}" tại ${company}`,
                    type: 'application',
                    time: 'Vừa xong',
                    read: false,
                    applicationId: applicationId,
                    jobId: jobId
                });
                if (notifications.length > 50) notifications.pop();
                localStorage.setItem('hr_notifications', JSON.stringify(notifications));
                
                console.log('✅ Đã lưu application:', application);
                return true;
            }

            // ==================== MỞ MODAL ỨNG TUYỂN ====================
            window.applyJob = function(event, jobId) {
                event.stopPropagation();
                
                const allJobsList = getAllJobs();
                const job = allJobsList.find(j => j.id == jobId);
                if (!job) return;
                
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                if (!currentUser) {
                    alert('Vui lòng đăng nhập để ứng tuyển!');
                    window.location.href = 'login.html';
                    return;
                }
                
                document.getElementById("applyJobTitle").textContent = job.title;
                document.getElementById("applyCompany").textContent = job.company;
                document.getElementById("applyLocation").innerHTML = `<i class="fas fa-map-marker-alt"></i> ${job.location || job.district || 'Đà Nẵng'}`;
                document.getElementById("applySalary").innerHTML = `<i class="fas fa-money-bill-wave"></i> ${job.salary || 'Thỏa thuận'}`;
                
                document.getElementById("applyName").value = currentUser.name || currentUser.fullname || '';
                document.getElementById("applyEmail").value = currentUser.email || '';
                document.getElementById("applyPhone").value = currentUser.phone || '';
                document.getElementById("applyMessage").value = '';
                
                const savedCVs = JSON.parse(localStorage.getItem('savedCVs')) || [];
                const cvSelect = document.getElementById("savedCVSelect");
                cvSelect.innerHTML = '<option value="">-- Chọn CV đã lưu --</option>';
                
                savedCVs.forEach((cv, index) => {
                    cvSelect.innerHTML += `<option value="${index}">${escapeHtml(cv.fullName || 'CV không tên')} - ${escapeHtml(cv.position || 'Chưa có vị trí')}</option>`;
                });
                
                document.getElementById("applyCCCD").value = '';
                document.getElementById("applyPassport").value = '';
                document.getElementById("selectedCVInfo").style.display = 'none';
                
                window.currentApplyingJob = job;
                document.getElementById("applyModal").classList.add("active");
            };
            
            // ==================== HIỂN THỊ THÔNG TIN CV ====================
            document.getElementById("savedCVSelect")?.addEventListener("change", function() {
                const index = this.value;
                const infoDiv = document.getElementById("selectedCVInfo");
                
                if (index === "") {
                    infoDiv.style.display = "none";
                    return;
                }
                
                const savedCVs = JSON.parse(localStorage.getItem('savedCVs')) || [];
                const cv = savedCVs[index];
                
                if (cv) {
                    infoDiv.style.display = "block";
                    infoDiv.innerHTML = `
                        <p><strong>Họ tên:</strong> ${escapeHtml(cv.fullName || '---')}</p>
                        <p><strong>Vị trí:</strong> ${escapeHtml(cv.position || '---')}</p>
                        <p><strong>Kỹ năng:</strong> ${escapeHtml(cv.skills || '---')}</p>
                        <p><strong>Kinh nghiệm:</strong> ${escapeHtml(cv.experience || '---')}</p>
                    `;
                    
                    if (cv.fullName) document.getElementById("applyName").value = cv.fullName;
                    if (cv.phone) document.getElementById("applyPhone").value = cv.phone;
                    if (cv.intro && !document.getElementById("applyMessage").value) {
                        document.getElementById("applyMessage").value = cv.intro;
                    }
                }
            });
            
            // ==================== SUBMIT ỨNG TUYỂN ====================
            document.getElementById("applyForm")?.addEventListener("submit", function(e) {
                e.preventDefault();
                
                const job = window.currentApplyingJob;
                if (!job) {
                    alert("Không tìm thấy thông tin công việc!");
                    return;
                }
                
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                if (!currentUser) {
                    alert("Vui lòng đăng nhập!");
                    window.location.href = "login.html";
                    return;
                }
                
                const name = document.getElementById("applyName").value.trim();
                const phone = document.getElementById("applyPhone").value.trim();
                const message = document.getElementById("applyMessage").value.trim();
                
                const selectedCVIndex = document.getElementById("savedCVSelect").value;
                const savedCVs = JSON.parse(localStorage.getItem('savedCVs')) || [];
                let cvData = {};
                
                if (selectedCVIndex !== "") {
                    const selectedCV = savedCVs[selectedCVIndex];
                    cvData = {
                        fullName: selectedCV.fullName || name,
                        phone: selectedCV.phone || phone,
                        skills: selectedCV.skills || '',
                        experience: selectedCV.experience || '',
                        education: selectedCV.education || '',
                        address: selectedCV.address || '',
                        intro: message || selectedCV.intro || ''
                    };
                } else {
                    cvData = {
                        fullName: name,
                        phone: phone,
                        skills: '',
                        experience: '',
                        education: '',
                        address: '',
                        intro: message
                    };
                }
                
                const cccdFile = document.getElementById("applyCCCD").files[0];
                const passportFile = document.getElementById("applyPassport").files[0];
                
                let cccdFileName = '';
                let passportFileName = '';
                
                if (cccdFile) cccdFileName = cccdFile.name;
                if (passportFile) passportFileName = passportFile.name;
                
                if (!cccdFile && !passportFile) {
                    alert("Vui lòng tải lên CCCD (Công dân Việt Nam) hoặc Hộ chiếu (Người nước ngoài)!");
                    return;
                }
                
                const success = submitApplication(
                    job.id,
                    job.title,
                    job.company,
                    job.location || job.district,
                    job.salary,
                    cvData,
                    cccdFileName,
                    passportFileName
                );
                
                if (success) {
                    alert(`✅ Ứng tuyển thành công!\n\nCông việc: ${job.title}\nCông ty: ${job.company}\n\nHồ sơ của bạn đã được gửi đến nhà tuyển dụng.`);
                    document.getElementById("applyForm").reset();
                    document.getElementById("selectedCVInfo").style.display = "none";
                    document.getElementById("applyModal").classList.remove("active");
                    window.currentApplyingJob = null;
                } else {
                    alert("❌ Có lỗi xảy ra, vui lòng thử lại!");
                }
            });
            
            // ==================== ĐÓNG MODAL ====================
            document.getElementById("closeApply")?.addEventListener("click", () => {
                document.getElementById("applyModal").classList.remove("active");
            });
            
            document.getElementById("applyModal")?.addEventListener("click", (e) => {
                if (e.target === document.getElementById("applyModal")) {
                    document.getElementById("applyModal").classList.remove("active");
                }
            });
            
            // ==================== LẮNG NGHE THAY ĐỔI TỪ LOCALSTORAGE ====================
            window.addEventListener("storage", (e) => {
                if (e.key === "jobs" || e.key === "hr_jobs") {
                    console.log("🔄 Phát hiện thay đổi dữ liệu jobs, đang cập nhật...");
                    const jobs = getAllJobs();
                    renderJobs(jobs);
                    renderFieldCards();
                }
            });
            
            // ==================== KHỞI TẠO ====================
            const initialJobs = getAllJobs();
            renderJobs(initialJobs);
            renderFieldCards();
        });
    </script>

    <script>
        window.goToProfile = function() { window.location.href = 'profile.html'; };
        window.handleLogout = function() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userName');
            localStorage.removeItem('rememberUser');
            window.location.reload();
        };
        
        function updateAuthUI() {
            const authDiv = document.getElementById('authButtons');
            const userDiv = document.getElementById('userBox');
            if (!authDiv || !userDiv) return;
            
            const currentUser = localStorage.getItem('currentUser');
            let isLoggedIn = false;
            let userName = "";
            
            if (currentUser) {
                try {
                    const user = JSON.parse(currentUser);
                    isLoggedIn = true;
                    userName = user.name || user.fullname || user.email?.split('@')[0] || "User";
                } catch(e) { isLoggedIn = false; }
            }
            
            if (!isLoggedIn && localStorage.getItem('isLoggedIn') === 'true') {
                isLoggedIn = true;
                userName = localStorage.getItem('userName') || "User";
            }
            
            if (isLoggedIn) {
                authDiv.style.display = 'none';
                userDiv.style.display = 'block';
                userDiv.innerHTML = `
                    <div class="user-info">
                        <div class="user-avatar" onclick="goToProfile()">${userName.charAt(0).toUpperCase()}</div>
                        <span class="user-name" onclick="goToProfile()" style="cursor: pointer; font-weight: 600;">${escapeHtml(userName)}</span>
                        <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
                    </div>
                `;
            } else {
                authDiv.style.display = 'flex';
                userDiv.style.display = 'none';
                userDiv.innerHTML = '';
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        document.addEventListener('DOMContentLoaded', updateAuthUI);
        window.addEventListener('storage', updateAuthUI);
    </script>
    <script src="notify-bridge.js"></script>
    <script src="floating.js"></script>
</body>
