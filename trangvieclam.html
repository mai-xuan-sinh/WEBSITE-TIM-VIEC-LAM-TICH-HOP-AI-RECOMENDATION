<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danang Work - Tất cả việc làm</title>

    <link rel="stylesheet" href="trangvieclam.css">
    <link rel="stylesheet" href="auth.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

<header class="navbar">
    <div class="container nav-content">

        <div class="logo-area">
            <div class="logo-main">DANANG WORK</div>
            <div class="logo-slogan">Tìm việc thông minh tại Đà Nẵng</div>
        </div>

        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="trangvieclam.html" class="active-link">Việc làm</a>
            <a href="congty.html">Công ty</a>
            <a href="xuhuong.html">Xu hướng</a>
            <a href="huongdan.html">Hướng dẫn</a>
            <a href="taocv.html">Tạo CV</a>
            <a href="hotro.html">Hỗ trợ</a>
        </nav>

        <div class="nav-right">
            <div id="authButtons">
                <a href="login.html">Đăng nhập</a>
                <a href="register.html">Đăng ký</a>
            </div>

            <div id="userBox"></div>
        </div>

    </div>
</header>

<main class="container content-wrapper">

    <div class="breadcrumb">
        Trang chủ / <strong>Tất cả việc làm phổ thông</strong>
    </div>

    <div class="header-section">
        <div class="title-group">
            <h1>Tất cả việc làm phổ thông</h1>
            <p class="results-count">Hiển thị</p>
        </div>
    </div>

    <!-- SEARCH -->
    <section class="search-box">

        <div class="search-inputs">

            <div class="input-field">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput"
                    placeholder="Tìm theo tên công việc, công ty, kỹ năng...">
            </div>

            <div class="input-field">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" value="Tất cả Đà Nẵng">
            </div>

            <button class="btn-filter">
                <i class="fa-solid fa-filter"></i>
                Bộ lọc
            </button>

        </div>

        <div class="search-suggestions">
            Gợi ý:
            <span>React</span>,
            <span>Node.js</span>,
            <span>Frontend</span>,
            <span>Backend</span>
        </div>

        <div id="fieldCards"></div>

    </section>

    <!-- JOB LIST -->
    <div class="job-list" id="all-jobs-container"></div>

</main>

<script src="jobs-data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const container = document.getElementById("all-jobs-container");

    // ===== RENDER JOB =====
    function renderJobs(jobs) {

        if (!container) return;

        if (jobs.length === 0) {
            container.innerHTML = `<p>Không có công việc phù hợp</p>`;
            return;
        }

        container.innerHTML = jobs.map(job => `
            <div class="job-item" onclick="goToJobDetail(${job.id})">
                <div class="job-card">

                    <div class="card-top">
                        <div class="comp-logo">
                            ${job.company.charAt(0)}
                        </div>

                        <div class="job-meta">
                            <h3>${job.title}</h3>
                            <p>${job.company}</p>
                        </div>
                    </div>

                    <div class="card-mid">
                        <span>${job.location}</span>
                        <span>${job.salary}</span>
                    </div>

                    <div class="card-tags">
                        ${(job.skills || []).map(s => `<span>${s}</span>`).join("")}
                    </div>

                    <div class="card-bottom">
                        <button class="btn-apply"
                            onclick="applyJob(event, ${job.id})">
                            Ứng tuyển
                        </button>
                    </div>

                </div>
            </div>
        `).join("");

        document.querySelector(".results-count").textContent =
            `Hiển thị ${jobs.length} việc làm`;
    }

    // ===== FIELD CARD =====
    function renderFieldCards() {
        const fieldContainer = document.getElementById("fieldCards");
        if (!fieldContainer) return;

        const counts = {};

        allJobs.forEach(j => {
            counts[j.field] = (counts[j.field] || 0) + 1;
        });

        fieldContainer.innerHTML = Object.entries(counts)
            .map(([field, total]) => `
                <div class="field-card" data-field="${field}">
                    <h3>${field}</h3>
                    <p>${total} việc làm</p>
                </div>
            `).join("");

        document.querySelectorAll(".field-card").forEach(card => {
            card.addEventListener("click", () => {
                const field = card.dataset.field;
                renderJobs(allJobs.filter(j => j.field === field));
            });
        });
    }

    // ===== SEARCH =====
    document.getElementById("searchInput").addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();

        const filtered = allJobs.filter(job =>
            job.title.toLowerCase().includes(value) ||
            job.company.toLowerCase().includes(value) ||
            job.skills.join(" ").toLowerCase().includes(value)
        );

        renderJobs(filtered);
    });

    // ===== GLOBAL FUNCTIONS =====
    window.goToJobDetail = function(id) {
        window.location.href = `job-detail.html?id=${id}`;
    };

    window.applyJob = function(event, id) {
    event.stopPropagation();
    window.location.href = `job-detail.html?id=${id}`;
};

    // INIT
    renderJobs(allJobs);
    renderFieldCards();
});
</script>

<script src="auth.js"></script>

</body>
</html>
