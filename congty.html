<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công ty - DANANG WORK</title>
    <link rel="stylesheet" href="style-congty.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <div>
                <div class="logo-main">DANANG WORK</div>
                <div class="logo-slogan">Tìm việc thông minh tại Đà Nẵng</div>
            </div>
            <nav class="nav-links">
                <a href="index.html">Trang chủ</a>
                <a href="trangvieclam.html">Việc làm</a>
                <a href="congty.html" class="active-link">Công ty</a>
                <a href="xuhuong.html">Xu hướng</a>
                <a href="huongdan.html">Hướng dẫn</a>
                <a href="taocv.html">Tạo CV</a>
                <a href="hotro.html">Hỗ trợ</a>
            </nav>
            <div class="nav-right">
                <div id="authButtons">
                    <a href="#" id="fakeLoginBtn">Đăng nhập</a>
                    <a href="#" id="fakeRegisterBtn">Đăng ký</a>
                </div>
                <div id="userBox"></div>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Top <span>công ty hàng đầu</span> tại Đà Nẵng</h1>
            <p>Khám phá những nhà tuyển dụng uy tín với môi trường làm việc chuyên nghiệp</p>
        </div>
    </section>

    <div class="container">
        <div class="filter-bar">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Tất cả</button>
                <button class="filter-btn" data-filter="it">Công nghệ thông tin</button>
                <button class="filter-btn" data-filter="tourism">Logistics - Vận hành</button>
                <button class="filter-btn" data-filter="realestate">Giáo dục - Đào tạo</button>
                <button class="filter-btn" data-filter="finance">Thiết kế - Sáng tạo</button>
                <button class="filter-btn" data-filter="logistics">Kinh doanh - Marketing</button>
                <button class="filter-btn" data-filter="logistics">Du lịch - Khách sạn</button>
                <button class="filter-btn" data-filter="logistics">Xây dựng - Bất động sản</button>
                <button class="filter-btn" data-filter="logistics">Tài chính - Ngân hàng</button>
            </div>
        </div>

        <div class="company-grid" id="companyGrid"></div>
    </div>

    <script>
        const companies = [
            { id: "fpt", name: "FPT Software", logo: "img/fpt.jpg", location: "Hải Châu, Đà Nẵng", size: "5000+ nhân viên", rating: 4.5, desc: "Phát triển phần mềm chất lượng cao cho thị trường Nhật Bản và Âu Mỹ.", category: "it" },
            { id: "philong", name: "PhiLong Technology", logo: "img/philong-logo.jpg", location: "Hải Châu, Đà Nẵng", size: "2000+ nhân viên", rating: 4.5, desc: "Môi trường làm việc sáng tạo, tập trung vào các dự án công nghệ mới.", category: "it" },
            { id: "enclave", name: "Enclave Software", logo: "img/images.png", location: "Sơn Trà, Đà Nẵng", size: "300+ nhân viên", rating: 4.5, desc: "Công ty phần mềm lâu đời với quy trình làm việc chuyên nghiệp.", category: "it" },
            { id: "vinpearl", name: "Vinpearl Resort & Spa", logo: "img/spa.png", location: "Ngũ Hành Sơn", size: "1000+ nhân viên", rating: 4.6, desc: "Hệ thống nghỉ dưỡng 5 sao đẳng cấp.", category: "tourism" },
            { id: "intercontinental", name: "InterContinental Danang", logo: "img/intercontinental.png", location: "Bán đảo Sơn Trà", size: "800+ nhân viên", rating: 4.8, desc: "Khu nghỉ dưỡng sang trọng bậc nhất thế giới.", category: "tourism" },
            { id: "sungroup", name: "Sun Group", logo: "img/logo-sungroup-2020.jpg", location: "Hải Châu", size: "3000+ nhân viên", rating: 4.7, desc: "Chủ đầu tư các dự án lớn tại Đà Nẵng.", category: "realestate" },
            { id: "trungnam", name: "Trung Nam Group", logo: "img/logo-trung-nam-group.png", location: "Liên Chiểu", size: "1500+ nhân viên", rating: 4.6, desc: "Tập đoàn đa ngành về năng lượng và hạ tầng.", category: "realestate" },
            { id: "lottemart", name: "Lotte Mart", logo: "img/logo-lotte-mart-vector-2.webp", location: "Hải Châu", size: "500+ nhân viên", rating: 4.4, desc: "Trung tâm thương mại lớn nhất Đà Nẵng.", category: "finance" },
            { id: "agribank", name: "Agribank", logo: "img/agr.png", location: "Hải Châu", size: "800+ nhân viên", rating: 4.5, desc: "Ngân hàng uy tín với môi trường ổn định.", category: "finance" },
            { id: "viettel", name: "Viettel Post", logo: "img/viet.png", location: "Toàn Đà Nẵng", size: "1000+ nhân viên", rating: 4.5, desc: "Doanh nghiệp chuyển phát hàng đầu.", category: "logistics" }
        ];

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            let stars = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) stars += "★";
                else stars += "☆";
            }
            return stars;
        }

        function renderCompanies(filter = "all") {
            const grid = document.getElementById("companyGrid");
            const filtered = filter === "all" ? companies : companies.filter(c => c.category === filter);
            grid.innerHTML = filtered.map(company => `
                <div class="company-card">
                    <div class="card-top">
                        <div class="company-logo"><img src="${company.logo}" alt="${company.name}" onerror="this.src='https://placehold.co/50?text=Logo'"></div>
                        <div>
                            <div class="company-name">${company.name}</div>
                            <div class="company-info">${company.location} | ${company.size}</div>
                            <div class="stars">${renderStars(company.rating)} ${company.rating}/5</div>
                        </div>
                    </div>
                    <div class="company-desc">${company.desc}</div>
                    <div class="card-buttons">
                        <button class="btn-outline" onclick="location.href='chitiet-congty.html?id=${company.id}#review'">Đánh giá</button>
                        <button class="btn-primary" onclick="location.href='chitiet-congty.html?id=${company.id}'">Xem chi tiết</button>
                    </div>
                </div>
            `).join("");
        }

        const filterBtns = document.querySelectorAll(".filter-btn");
        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                filterBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderCompanies(btn.getAttribute("data-filter"));
            });
        });
        renderCompanies();

        // LOGIN/LOGOUT - ĐÃ SỬA LỖI UNDEFINED
        (function() {
            const AUTH_KEY = 'isLoggedIn';
            const DEFAULT_USER = 'Nguyễn Văn A';
            const authDiv = document.getElementById('authButtons');
            const userDiv = document.getElementById('userBox');
            const loginBtn = document.getElementById('fakeLoginBtn');
            const registerBtn = document.getElementById('fakeRegisterBtn');
            
            function getUserName() {
                let name = localStorage.getItem('userName');
                if (!name || name === 'undefined' || name === 'null' || name === '') {
                    return DEFAULT_USER;
                }
                return name;
            }
            
            function renderUI() {
                const isLoggedIn = localStorage.getItem(AUTH_KEY) === 'true';
                if (isLoggedIn) {
                    const userName = getUserName();
                    authDiv.style.display = 'none';
                    userDiv.innerHTML = `
                        <div class="user-info">
                            <div class="user-avatar">${userName.charAt(0)}</div>
                            <span>${userName}</span>
                            <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
                        </div>
                    `;
                    const logoutBtn = document.getElementById('logoutBtn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', () => {
                            localStorage.setItem(AUTH_KEY, 'false');
                            localStorage.removeItem('userName');
                            renderUI();
                            alert('Đã đăng xuất!');
                        });
                    }
                } else {
                    authDiv.style.display = 'flex';
                    userDiv.innerHTML = '';
                }
            }
            
            if (loginBtn) {
                loginBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.setItem(AUTH_KEY, 'true');
                    localStorage.setItem('userName', DEFAULT_USER);
                    renderUI();
                    alert('Đăng nhập thành công!');
                });
            }
            
            if (registerBtn) {
                registerBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.setItem(AUTH_KEY, 'true');
                    localStorage.setItem('userName', DEFAULT_USER);
                    renderUI();
                    alert('Đăng ký thành công!');
                });
            }
            
            renderUI();
        })();
    </script>
    <script src="auth.js"></script>
</body>
</html>
